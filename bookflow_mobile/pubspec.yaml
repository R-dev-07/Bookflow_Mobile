name: bookflow_mobile
description: BookFlow mobile app for customers, providers and admins (Android, iOS, Web).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  clerk_flutter: ^0.0.16-beta
  http: ^1.2.2
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
